spring:
  application:
    name: pulsepass
  datasource:
    url: jdbc:postgresql://localhost:5432/pulsepass
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration