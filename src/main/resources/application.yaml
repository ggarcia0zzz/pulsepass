spring:
  application:
    name: pulsepass
  datasource:
    url: jdbc:postgresql://localhost:5432/pulsepass
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

pulsepass:
  ticket:
    # Precio base de un ticket GENERAL; el resto de tipos aplica un multiplicador (TicketPriceCalculator)
    base-price: 100000.00

  security:
    jwt:
      issuer: ${PULSEPASS_JWT_ISSUER:pulsepass-api}
      # Sin valor por defecto: la aplicación FALLA al arrancar si falta o mide menos de 32 bytes.
      secret-base64: ${PULSEPASS_JWT_SECRET_BASE64}
      access-token-ttl: ${PULSEPASS_JWT_ACCESS_TTL:PT15M}
    cors:
      # Lista separada por comas. Vacío = ningún origen cruzado permitido.
      allowed-origins: ${PULSEPASS_CORS_ALLOWED_ORIGINS:}
  bootstrap:
    # Semilla LOCAL (solo perfil "dev"). Sin contraseña en el entorno no se crea nada.
    admin:
      username: ${PULSEPASS_BOOTSTRAP_ADMIN_USERNAME:admin}
      email: ${PULSEPASS_BOOTSTRAP_ADMIN_EMAIL:admin@pulsepass.local}
      password: ${PULSEPASS_BOOTSTRAP_ADMIN_PASSWORD:}
    staff:
      username: ${PULSEPASS_BOOTSTRAP_STAFF_USERNAME:staff}
      email: ${PULSEPASS_BOOTSTRAP_STAFF_EMAIL:staff@pulsepass.local}
      password: ${PULSEPASS_BOOTSTRAP_STAFF_PASSWORD:}

logging:
  pattern:
    # Incluye el request ID (RequestIdFilter) para correlacionar logins y denegaciones.
    level: "%5p [%X{requestId:-}]"
